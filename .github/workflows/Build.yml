name: Build FaceFusion Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK, NDK 27.2 & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download & Extract Qualcomm QAIRT SDK
        run: |
          mkdir -p /tmp/qairt
          curl -fL "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.31.0.250130/v2.31.0.250130.zip" -o /tmp/qairt.zip
          unzip -q /tmp/qairt.zip -d /tmp/qairt
          rm -f /tmp/qairt.zip
          SDK_DIR=$(find /tmp/qairt -maxdepth 3 -name "QnnBackend.h" -exec dirname {} \; | sed 's|/include/QNN||' | head -n 1)
          echo "Found QNN_SDK_ROOT at: $SDK_DIR"
          echo "QNN_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradle & Scripts
        run: |
          chmod +x work/android/gradlew
          chmod +x work/android/*.sh || true

      - name: Build Debug APK
        run: |
          cd work/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-mobile-no-censorship
          path: work/android/**/build/outputs/apk/debug/*.apk
