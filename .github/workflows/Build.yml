name: Export All Repo Files

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle All Text & Code Files
        run: |
          find . -maxdepth 10 -not -path '*/.*' -o -path './.github/*' | sort | while read -r f; do
            if [ -f "$f" ]; then
              case "$f" in
                *.kt|*.kts|*.yml|*.yaml|*.xml|*.cpp|*.h|*.txt|*.md|*.sh|*.properties|*.json)
                  echo "==================== FILE: $f ====================" >> all_repo_files.txt
                  cat "$f" >> all_repo_files.txt
                  echo "" >> all_repo_files.txt
                  ;;
              esac
            fi
          done
          ls -lh all_repo_files.txt

      - name: Upload Bundled Source Text
        uses: actions/upload-artifact@v4
        with:
          name: all_repo_files
          path: all_repo_files.txt
